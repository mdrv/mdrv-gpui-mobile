# Android cross-compilation — NDK r29 on this machine.
# cc-rs build scripts and the linker resolve via these paths; override on
# other machines (CI) by pointing at that install's prebuilt bin dir.
[target.aarch64-linux-android]
linker = "/home/ua/Android/ndk/r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

[env]
CC_aarch64_linux_android = "/home/ua/Android/ndk/r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
CXX_aarch64_linux_android = "/home/ua/Android/ndk/r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
AR_aarch64_linux_android = "/home/ua/Android/ndk/r29/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
